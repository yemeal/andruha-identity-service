[project]
name = "andruha-identity-service"
version = "0.1.0"
description = "Andruha credentials and authentication session boundary"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "starlette (>=1.6.0,<2.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "uvicorn (>=0.52.3,<0.53.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "dishka (>=1.10.1,<2.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
    "cryptography (>=50.0.0,<51.0.0)",
    "pwdlib[argon2] (>=0.2.1,<0.3.0)",
    "prometheus-client (>=0.23.0,<1.0.0)",
    "redis[hiredis] (>=8.0.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.3,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "httpx (>=0.28.1,<1.0.0)",
    "httpx2 (>=2.10.0,<3.0.0)",
    "testcontainers[postgres,redis] (>=4.9.0,<5.0.0)"
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "integration: test that crosses an application or adapter boundary",
    "race: concurrency test against real infrastructure",
    "failure_path: dependency or transaction failure integration test",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
