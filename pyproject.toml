[project]
name = "andruha-identity-service"
version = "0.1.0"
description = "Andruha credentials and authentication session boundary"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "starlette (>=1.6.0,<2.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "uvicorn (>=0.52.3,<0.53.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "dishka (>=1.10.1,<2.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
    "cryptography (>=50.0.0,<51.0.0)",
    "pwdlib[argon2] (>=0.2.1,<0.3.0)",
    "prometheus-client (>=0.23.0,<1.0.0)",
    "redis[hiredis] (>=8.0.0,<9.0.0)",
    "faststream[kafka] (>=0.7.4,<0.8.0)",
    "httpx2 (==2.12.0)"
]


[tool.poetry]
packages = [{include = "app", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.3,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "httpx (>=0.28.1,<1.0.0)",
    "httpx2 (>=2.10.0,<3.0.0)",
    "testcontainers[postgres,redis] (>=4.9.0,<5.0.0)"
]

# ============================================================
# RUFF CONFIGURATION
# ============================================================
[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "PERF",   # perflint
    "ARG",    # flake8-unused-arguments
    "RET",    # flake8-return
]
ignore = [
    "E501",    # line length handled by formatter
    "S104",    # possible binding to all interfaces (0.0.0.0)
    "S105",    # false positive on TOKEN_TYPE="at+jwt"
    "S311",    # standard pseudo-random for jitter
    "S603",    # subprocess without shell=True
    "S607",    # partial executable path
    "RUF001",  # ambiguous unicode in docstrings
    "RUF002",
    "RUF003",
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments in functions
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments
    "PLR2004", # magic value comparisons
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = [
    "S101",
    "S104",
    "S105",
    "S106",
    "S107",
    "PLR2004",
    "PLR0912",
    "PLR0915",
    "PLC0415",
    "ARG",
    "I",
    "PTH",
    "ASYNC",
    "C4",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================
# PYRIGHT CONFIGURATION — STRICTNESS LEVEL 2
# ============================================================
[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".git",
    ".mypy_cache",
    ".pyright_cache",
    ".ruff_cache",
    ".pytest_cache",
    ".venv",
]
pythonVersion = "3.14"
typeCheckingMode = "strict"

# Strictness Level 2 (relaxed for third-party dynamic DI & stubs)
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false

# Full strictness on our codebase
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true

reportMissingParameterType = true
reportMissingTypeArgument = true
reportUnknownParameterType = true
reportUnknownLambdaType = true
reportUntypedFunctionDecorator = true
reportUntypedClassDecorator = true
reportUntypedBaseClass = true
reportUntypedNamedTuple = true

reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInconsistentConstructor = true
reportUninitializedInstanceVariable = true
reportOverlappingOverload = true

reportPrivateUsage = true
reportConstantRedefinition = true
reportInvalidStubStatement = true
reportIncompleteStub = true
reportUnsupportedDunderAll = true
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedVariable = "error"
reportUnusedImport = "error"
reportDuplicateImport = "error"

reportUnnecessaryIsInstance = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnnecessaryTypeIgnoreComment = "error"

reportGeneralTypeIssues = true
reportPropertyTypeMismatch = true
reportFunctionMemberAccess = true
reportCallInDefaultInitializer = true
reportImplicitStringConcatenation = true

venvPath = "."
venv = ".venv"

# ============================================================
# PYTEST CONFIGURATION
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "integration: test that crosses an application or adapter boundary",
    "race: concurrency test against real infrastructure",
    "failure_path: dependency or transaction failure integration test",
]

# ============================================================
# COVERAGE CONFIGURATION
# ============================================================
[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
